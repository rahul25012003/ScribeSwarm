name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # The whole suite runs on the deterministic mock provider with fake
      # tools — zero network, zero API keys, zero quota (ADR-002).
      - run: python -m pytest tests -q
